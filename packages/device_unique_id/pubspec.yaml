name: device_unique_id
description: "Persistent device unique identifier across app reinstalls for Android (ANDROID_ID) and iOS (Keychain)."
version: 0.0.1

environment:
  sdk: ^3.8.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.app.device_unique_id
        pluginClass: DeviceUniqueIdPlugin
      ios:
        pluginClass: DeviceUniqueIdPlugin
